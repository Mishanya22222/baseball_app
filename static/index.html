<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseball Stats Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <div class="header-accent"></div>
        <div class="header-content">
            <h1>⚾ Baseball Stats Tracker</h1>
            <p class="tagline">Explore Historical Baseball Data</p>
        </div>
        <div class="header-accent"></div>
    </header>

    <main class="container">
        <section class="filters-section">
            <h2>Select Year & Team</h2>
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="year-select">📅 Year</label>
                    <select id="year-select" disabled>
                        <option value="">Loading years...</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="team-select">🏟️ Team</label>
                    <select id="team-select" disabled>
                        <option value="">Select a year first</option>
                    </select>
                </div>
            </div>
        </section>

        <section id="players-section" class="players-section" hidden>
            <div class="players-header">
                <h2 id="team-title">Players</h2>
                <p id="team-info" class="team-info"></p>
            </div>
            <div id="players-grid" class="players-grid"></div>
        </section>

        <section id="empty-state" class="empty-state">
            <div class="empty-message">
                <p>👆 Select a year and team to view the roster</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Baseball Stats Tracker | Historical Data</p>
    </footer>

    <script src="/script.js"></script>
</body>
</html>
